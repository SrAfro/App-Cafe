<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qual bebida combina com você?</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% -10%, #3a2a1f 0%, #1c130e 55%, #120b08 100%);
    margin: 0; padding: 24px; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 360px; background: #0f0906; border-radius: 28px;
    padding: 10px 10px 22px; box-shadow: 0 30px 60px rgba(0,0,0,0.55);
  }
  .screen {
    border-radius: 20px; background: linear-gradient(180deg, #1a120d 0%, #120c08 100%);
    border: 1px solid rgba(232,163,61,0.15); padding: 22px 20px 20px; min-height: 320px; position: relative;
  }
  .meta {
    font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.14em;
    color: #5B8A8C; text-transform: uppercase; margin-bottom: 14px;
    display: flex; justify-content: space-between;
  }
  h1 {
    font-family: Georgia, serif; font-weight: 600; font-size: 21px; line-height: 1.28;
    color: #F2E8D5; margin: 0 0 20px;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .options button {
    text-align: left; padding: 14px 16px; border-radius: 12px;
    border: 1px solid rgba(232,163,61,0.25);
    background: linear-gradient(180deg, #241811 0%, #1a1109 100%);
    color: #F2E8D5; font-size: 14.5px; font-family: 'Inter', sans-serif; cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .options button:active { background: linear-gradient(180deg, #E8A33D 0%, #C97F1F 100%); color: #1c130e; transform: scale(0.97); }
  .result { display: none; text-align: center; padding: 8px 0 4px; }
  .result.active { display: block; }
  .result-label { font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.14em; color: #5B8A8C; text-transform: uppercase; margin-bottom: 10px; }
  .result h2 { font-family: Georgia, serif; font-weight: 700; font-size: 25px; color: #E8A33D; margin: 0 0 8px; }
  .price { font-family: 'Courier New', monospace; font-size: 13px; color: #c9bba3; margin-bottom: 14px; }
  .notas { color: #c9bba3; font-size: 14px; line-height: 1.5; margin: 0 0 14px; }
  .bolts-row { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 6px; }
  .mg { font-family: 'Courier New', monospace; font-size: 11px; color: #5B8A8C; }
  .disclaimer { font-size: 10.5px; color: rgba(201,187,163,0.55); margin-bottom: 16px; font-style: italic; }
  .perfil { border-top: 1px dashed rgba(232,163,61,0.25); padding-top: 14px; margin-bottom: 22px; font-family: Georgia, serif; font-style: italic; font-size: 14px; color: #E8A33D; }
  .restart { padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(232,163,61,0.3); background: transparent; color: #E8A33D; font-size: 13.5px; font-family: 'Inter', sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="screen">
    <div class="meta">
      <span>TCN 7N · COFFEE</span>
      <span id="metaRight">PASSO 1</span>
    </div>
    <button id="backBtn" onclick="goBack()" style="display:none;background:none;border:none;color:#5B8A8C;font-family:'Inter',sans-serif;font-size:13px;cursor:pointer;padding:0 0 14px;">← Voltar</button>

    <div id="questionArea">
      <h1 id="qLabel"></h1>
      <div class="options" id="qOptions"></div>
    </div>

    <div class="result" id="resultArea">
      <div class="result-label">Sua recomendação</div>
      <h2 id="rTitle"></h2>
      <div class="price" id="rPrice"></div>
      <p class="notas" id="rNotas"></p>
      <div class="bolts-row">
        <span id="rBolts"></span>
        <span class="mg" id="rMg"></span>
      </div>
      <div class="disclaimer">valor de referência, pode variar por lote do insumo</div>
      <div class="perfil" id="rPerfil"></div>
      <button class="restart" onclick="restart()">Refazer teste</button>
    </div>
  </div>
</div>

<script>
/* ---------- Árvore de perguntas ---------- */
const NODES = {
  start: { label: "O que você está com vontade agora?", options: [
    { text: "Café puro, sem leite", next: "cafePuro" },
    { text: "Algo cremoso, com leite", next: "cremoso" },
    { text: "Um energético reforçado", next: "RESULT:ultra" },
    { text: "Sem cafeína, ou um chá", next: "semCafeina" },
  ]},
  cafePuro: { label: "Prefere estilo espresso ou café coado tradicional?", options: [
    { text: "Café coado, mais leve", next: "coado" },
    { text: "Estilo espresso, mais encorpado", next: "espresso" },
  ]},
  coado: { label: "Com ou sem açúcar?", options: [
    { text: "Sem açúcar", next: "RESULT:cafeSimples" },
    { text: "Com açúcar", next: "RESULT:cafeSimplesAdocado" },
  ]},
  espresso: { label: "Quanta intensidade você quer?", options: [
    { text: "Um golinho bem concentrado", next: "RESULT:ristretto" },
    { text: "Dose única, equilibrada", next: "curtoAcucar" },
    { text: "Mais diluído, para tomar com calma", next: "longoAcucar" },
    { text: "Dose dupla, reforçada", next: "duploAcucar" },
  ]},
  curtoAcucar: { label: "Com ou sem açúcar?", options: [
    { text: "Sem açúcar", next: "RESULT:curto" },
    { text: "Com açúcar", next: "RESULT:curtoAdocado" },
  ]},
  longoAcucar: { label: "Com ou sem açúcar?", options: [
    { text: "Sem açúcar", next: "RESULT:longo" },
    { text: "Com açúcar", next: "RESULT:longoAdocado" },
  ]},
  duploAcucar: { label: "Com ou sem açúcar?", options: [
    { text: "Sem açúcar", next: "RESULT:duplo" },
    { text: "Com açúcar", next: "RESULT:duploAdocado" },
  ]},
  cremoso: { label: "Prefere cappuccino aerado ou café cremoso com leite?", options: [
    { text: "Cappuccino", next: "cappSize" },
    { text: "Café com leite", next: "RESULT:cafeComLeite" },
  ]},
  cappSize: { label: "Pequeno ou grande?", options: [
    { text: "Pequeno", next: "RESULT:cappPequeno" },
    { text: "Grande", next: "RESULT:cappGrande" },
  ]},
  semCafeina: { label: "Prefere chocolate quente ou um chá?", options: [
    { text: "Chocolate quente", next: "RESULT:chocolate" },
    { text: "Chá mate", next: "RESULT:chaMate" },
  ]},
};

/* ---------- Catálogo real (fichas técnicas da VMpay) ---------- */
const RESULTS = {
  cafeSimples: { title: "Café Simples", price: "R$ 4,00", cafeina: 80,
    notas: "Café coado clássico, leve e redondo.", perfil: "Seu perfil: sem frescura, só o cafezinho de sempre." },
  cafeSimplesAdocado: { title: "Café Simples Adoçado", price: "R$ 4,00", cafeina: 80,
    notas: "O mesmo café coado, com um toque doce.", perfil: "Seu perfil: gosta do simples, mas com um carinho a mais." },
  ristretto: { title: "Espresso Ristretto", price: "R$ 5,00", cafeina: 125,
    notas: "Golinho super concentrado, quase um xarope de café.", perfil: "Seu perfil: prefere qualidade a quantidade." },
  curto: { title: "Espresso Curto", price: "R$ 5,00", cafeina: 125,
    notas: "Encorpado, notas de cacau amargo.", perfil: "Seu perfil: direto ao ponto, sem enrolação." },
  curtoAdocado: { title: "Espresso Curto Adoçado", price: "R$ 5,00", cafeina: 125,
    notas: "Encorpado, com final mais suave e doce.", perfil: "Seu perfil: gosta de intensidade com um final gentil." },
  longo: { title: "Espresso Longo", price: "R$ 6,00", cafeina: 125,
    notas: "Mesma base do curto, mais alongado e suave.", perfil: "Seu perfil: gosta de saborear com calma." },
  longoAdocado: { title: "Espresso Longo Adoçado", price: "R$ 6,00", cafeina: 125,
    notas: "Suave e adocicado, fácil de beber.", perfil: "Seu perfil: sem pressa, sem amargor." },
  duplo: { title: "Espresso Duplo", price: "R$ 9,00", cafeina: 155,
    notas: "Reforço total, bem encorpado.", perfil: "Seu perfil: encara o que vier, sem meio-termo." },
  duploAdocado: { title: "Espresso Duplo Adoçado", price: "R$ 9,00", cafeina: 155,
    notas: "Reforçado, mas com final mais doce.", perfil: "Seu perfil: quer energia máxima sem abrir mão do conforto." },
  cappPequeno: { title: "Cappuccino Pequeno", price: "R$ 8,00", cafeina: 25,
    notas: "Cremoso, espuma leve, toque de canela.", perfil: "Seu perfil: quer se mimar sem exagerar." },
  cappGrande: { title: "Cappuccino Grande", price: "R$ 9,00", cafeina: 35,
    notas: "Mais cremoso e encorpado, para durar mais.", perfil: "Seu perfil: gosta de aproveitar com calma." },
  cafeComLeite: { title: "Café com Leite Adoçado", price: "R$ 5,00", cafeina: 95,
    notas: "Cremoso, equilíbrio entre café e leite doce.", perfil: "Seu perfil: quer conforto com uma pitada de energia." },
  ultra: { title: "Ultra Café DB", price: "R$ 10,00", cafeina: 195,
    notas: "Extra concentrado, Ultra Coffee Double Shot puro — feito para acordar de vez.", perfil: "Seu perfil: sem tempo a perder, precisa do máximo agora." },
  chocolate: { title: "Chocolate ao Leite", price: "R$ 7,00", cafeina: 9,
    notas: "Doce, cremoso, conforto puro — praticamente sem cafeína.", perfil: "Seu perfil: quer aconchego, não energia." },
  chaMate: { title: "Chá Matte", price: "R$ 4,00", cafeina: 30,
    notas: "Leve, herbal, levemente amargo.", perfil: "Seu perfil: prefere leveza a intensidade." },
};

function caffeineToDots(mg) {
  if (mg <= 0) return 0;
  if (mg <= 30) return 1;
  if (mg <= 70) return 2;
  if (mg <= 110) return 3;
  if (mg <= 160) return 4;
  return 5;
}

function boltsHtml(level) {
  let html = '';
  for (let i = 0; i < 5; i++) {
    const color = i < level ? '#E8A33D' : 'rgba(232,163,61,0.18)';
    html += '<svg width="13" height="13" viewBox="0 0 24 24" fill="' + color + '" style="margin-right:2px"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>';
  }
  return html;
}

let nodeId = 'start';
let history = [];

function render() {
  const isResult = nodeId.startsWith('RESULT:');
  document.getElementById('metaRight').innerText = isResult ? 'OK' : ('PASSO ' + (history.length + 1));
  document.getElementById('backBtn').style.display = history.length > 0 ? 'flex' : 'none';

  if (isResult) {
    document.getElementById('questionArea').style.display = 'none';
    document.getElementById('resultArea').classList.add('active');
    const r = RESULTS[nodeId.split(':')[1]];
    document.getElementById('rTitle').innerText = r.title;
    document.getElementById('rPrice').innerText = r.price;
    document.getElementById('rNotas').innerText = r.notas;
    document.getElementById('rBolts').innerHTML = boltsHtml(caffeineToDots(r.cafeina));
    document.getElementById('rMg').innerText = '≈ ' + r.cafeina + ' mg cafeína';
    document.getElementById('rPerfil').innerText = r.perfil;

    // Registro anonimo e agregado (sem dados pessoais) - so funciona se houver backend
    fetch('/registrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recomendacao: nodeId.split(':')[1], timestamp: new Date().toISOString() })
    }).catch(() => {});
  } else {
    document.getElementById('questionArea').style.display = 'block';
    document.getElementById('resultArea').classList.remove('active');
    const node = NODES[nodeId];
    document.getElementById('qLabel').innerText = node.label;
    const optsDiv = document.getElementById('qOptions');
    optsDiv.innerHTML = '';
    node.options.forEach((opt) => {
      const btn = document.createElement('button');
      btn.innerText = opt.text;
      btn.onclick = () => { history.push(nodeId); nodeId = opt.next; render(); };
      optsDiv.appendChild(btn);
    });
  }
}

function goBack() {
  if (history.length === 0) return;
  nodeId = history.pop();
  render();
}

function restart() {
  nodeId = 'start';
  history = [];
  render();
}

render();
</script>
</body>
</html>
